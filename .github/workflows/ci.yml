name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install (build-time @boardstate/* from npm)
        run: npm ci

      - name: Build (web tab + sidecar + vendored element bundle)
        run: npm run build

      - name: Sidecar smoke test (control plane + nonce gate)
        run: node test/sidecar-smoke.mjs

      - name: MCP single-host liveness (agent tool call → live board update)
        run: node test/mcp-liveness.mjs

      - name: Broker wiring (config → connect → discover → request → read, headless)
        run: node test/broker-fixture.mjs

      - name: Operational e2e (request → approve → invoke → park → confirm → result)
        run: node test/operational-e2e.mjs

      - name: Secret redaction (connector config never reaches the agent MCP surface)
        run: node test/secret-redaction.mjs

      - name: Anti-rug-pull (manifest drift re-pends the grant, never executes)
        run: node test/rugpull-repend.mjs

      - name: Operator secret (port-file knowledge cannot drive the operator plane — SEC-1)
        run: node test/operator-secret.mjs

      - name: Invoke timeout (an unconfirmed mutation settles as parked, never hangs — CORRECT-1)
        run: node test/invoke-timeout.mjs

      - name: Sidecar replacement drains accepted native invocations
        run: node test/sidecar-drain.mjs

      - name: Agent-scoped grants (MCP agent context threaded through the gate — CORRECT-2)
        run: node test/scoped-grant.mjs

      - name: Hermes data resolver wire-contract (rpc bindings → REST fixture)
        run: node test/hermes-data.mjs

      - name: Chat event translator (Hermes stream → §14 AgentStreamEvent)
        run: node test/chat-translate.mjs

      - name: Theme adapter (Hermes palette tokens → --bs-* mapping)
        run: node test/theme.mjs

      - name: Web skin (Hermes design language in the shipped bundle)
        run: node test/skin-web.mjs

      - name: Board templates (each is a schema-valid, allowlisted workspace)
        run: node test/templates.mjs

      - name: Custom widgets (pending 404s; approved serves with the CSP jail)
        run: node test/custom-widget.mjs

      - name: OfficeCLI preset (detect-or-instruct, stamps a valid connector)
        run: node test/officecli-preset.mjs

      - name: Desktop plugin bundle (loader-safe imports + contract + inlined boardstate)
        run: node test/desktop-plugin.mjs

      - name: Operator UX wiring (web + desktop route approve/confirm through the gate)
        run: node test/operator-ux.mjs

      - name: Assert built artifacts committed and in sync
        run: |
          git diff --exit-code -- dashboard/dist desktop dashboard/sidecar dashboard/vendor dashboard/tools.schema.json \
            || (echo "::error::Built artifacts are stale — run 'npm run build' and commit." && exit 1)

  node20-runtime:
    # README promises Node >= 20: run the committed sidecar bundle on the minimum runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (test-time @boardstate/* from npm)
        run: npm ci

      - name: Committed sidecar bundle runs on Node 20
        run: |
          node test/sidecar-smoke.mjs
          node test/mcp-liveness.mjs
          node test/sidecar-drain.mjs
          node test/operator-secret.mjs
          node test/invoke-timeout.mjs
          node test/operational-e2e.mjs
          node test/secret-redaction.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend test deps
        run: pip install fastapi websockets httpx

      - name: Byte-compile the plugin backend
        run: python -m py_compile __init__.py boardstate_sidecar.py dashboard/plugin_api.py

      - name: Router import + shape check (no Hermes host required)
        run: python test/plugin_api_check.py

      - name: Tokenized asset proxy at runtime (traversal-jailed, CSP verbatim)
        run: python test/asset_proxy.py

      - name: WebSocket upgrade auth (fail-closed compatibility + request boundary)
        run: python test/ws_auth.py

      - name: Operator gate wire-contract (plugin_api → sidecar exact param shapes)
        run: python test/operator_wire.py

      - name: Shared sidecar ownership replacement preserves state
        run: python test/sidecar_runtime.py

      - name: Process exit reaps sidecars and verifies identity before replacement
        run: python test/sidecar_exit.py

      - name: Sidecar adoption and shutdown remain single-writer
        run: python test/sidecar_concurrency.py

      - name: Windows lifecycle decisions use a cross-process lock
        run: python test/windows_lock.py

      - name: Desktop live acknowledgement requires an upstream connection
        run: python test/desktop_ack.py

      - name: Native 19-tool registration + real-sidecar dispatch
        run: python test/native_plugin.py

      - name: Liveness probe never signals the checked process
        run: python test/pid_alive.py

      - name: Agent-owned sidecars carry no operator secret
        run: python test/agent_operator_secret.py

  windows-lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile the sidecar lifecycle module
        run: python -m py_compile boardstate_sidecar.py

      - name: Liveness probe never terminates the checked process (real Windows)
        run: python test/pid_alive.py

      - name: Windows lifecycle decisions use a cross-process lock
        run: python test/windows_lock.py

  hermes-catalog-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HERMES_HOME: /tmp/boardstate-hermes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: npm ci

      - name: Rebuild committed artifacts and tool schema
        run: npm run build

      - name: Tool schema and generated artifacts are in sync
        run: git diff --exit-code -- dashboard/tools.schema.json dashboard/dist desktop dashboard/sidecar dashboard/vendor

      - name: Install pinned upstream Hermes
        run: |
          git clone --filter=blob:none https://github.com/NousResearch/hermes-agent.git "${RUNNER_TEMP}/hermes-agent"
          git -C "${RUNNER_TEMP}/hermes-agent" checkout 38c289c0146ed8c8b2b767eca1fff6f5b7e6382e
          test "$(git -C "${RUNNER_TEMP}/hermes-agent" rev-parse HEAD)" = 38c289c0146ed8c8b2b767eca1fff6f5b7e6382e
          pip install -e "${RUNNER_TEMP}/hermes-agent"

      - name: Hermes catalog validation
        run: hermes plugins validate .

      - name: Hermes real-loader doctor (19 tools)
        run: hermes plugins doctor . --ci

      - name: Hermes compatibility gate
        run: hermes plugins compat .

      - name: Python tests against real Hermes
        run: |
          python test/plugin_api_check.py
          python test/asset_proxy.py
          python test/ws_auth.py
          python test/operator_wire.py
          python test/sidecar_runtime.py
          python test/sidecar_exit.py
          python test/sidecar_concurrency.py
          python test/profile_scope.py
          python test/desktop_ack.py
          python test/native_plugin.py
          python test/agent_operator_secret.py

      - name: Install into an isolated Hermes home
        run: |
          mkdir -p "$HERMES_HOME/plugins"
          ln -s "$GITHUB_WORKSPACE" "$HERMES_HOME/plugins/boardstate"
          hermes plugins enable boardstate

      - name: Real PluginManager registration and dispatch
        run: python test/real_hermes_plugin_manager.py

      - name: Real dashboard HTTP and WebSocket acceptance
        run: python test/dashboard_real_hermes.py

      - name: Loopback sidecar traffic ignores environment proxies
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          all_proxy: http://127.0.0.1:9
          NO_PROXY: ""
          no_proxy: ""
        run: |
          python test/native_plugin.py
          python test/dashboard_real_hermes.py
